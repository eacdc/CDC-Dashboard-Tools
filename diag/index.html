<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDC · Why is this party's figure what it is?</title>
<style>
  :root{--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--ink:#0f172a;--dim:#64748b;--teal:#0f766e;--red:#dc2626;--amber:#b45309;--green:#15803d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px}
  h1{margin:0;font-size:16px}
  .sub{font-size:12px;color:var(--dim);margin-top:3px}
  main{padding:18px 20px;max-width:1200px}
  form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  input,select,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
  input{min-width:260px}
  button{background:var(--teal);color:#fff;border-color:var(--teal);cursor:pointer;font-weight:600}
  button:disabled{opacity:.55;cursor:progress}
  section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
  h2{margin:0;padding:10px 14px;font-size:12.5px;background:#f1f5f9;border-bottom:1px solid var(--line);
     font-family:ui-monospace,monospace;letter-spacing:.03em;color:#334155}
  .body{padding:12px 14px}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;color:var(--dim);
     font-family:ui-monospace,monospace;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:6px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  td.num{text-align:right;font-family:ui-monospace,monospace;white-space:nowrap}
  .mono{font-family:ui-monospace,monospace}
  .muted{color:var(--dim)}
  .tag{display:inline-block;font-size:10px;font-family:ui-monospace,monospace;padding:1px 6px;
       border-radius:5px;background:#f1f5f9;color:#475569;margin-left:5px}
  .tag.warn{background:#fef3c7;color:var(--amber)}
  .tag.good{background:#dcfce7;color:var(--green)}
  .tag.bad{background:#fee2e2;color:var(--red)}
  .note{font-size:12px;color:var(--dim);padding:0 14px 12px}
  .err{color:var(--red);font-family:ui-monospace,monospace;font-size:12.5px}
  details>summary{cursor:pointer;font-size:12px;color:var(--teal);padding:4px 0}
  .copybar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .copybar button{padding:6px 12px;font-size:12px}
  .copied{font-size:12px;color:var(--green);font-weight:600}
  pre{margin:6px 0 0;font-size:11.5px;background:#f8fafc;border:1px solid var(--line);
      border-radius:6px;padding:8px;overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1>Why is this party's figure what it is?</h1>
  <div class="sub">Type part of a customer or supplier name. Nothing here changes any figure &mdash; it only explains one.</div>
</header>
<main>
  <form id="f">
    <input id="q" placeholder="e.g. Carbonlite" autofocus>
    <select id="branch"><option value="all">Consolidated</option><option value="kol">KOL</option><option value="ahm">AHM</option></select>
    <select id="fy"></select>
    <button id="go">Explain</button>
    <span class="sub">the year narrows sections 2 and 3 only &mdash; the ledgers and the bills always cover every year</span>
  </form>
  <div id="out"></div>
</main>
<script>
(function(){
  var out=document.getElementById('out');
  var MN=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
  // The page is served from the same origin as the API, but it also has to work when
  // opened straight off disk, which is how it gets used on the office machine.
  var BASE=(location.protocol==='file:')?'https://cdc-finance-automated.onrender.com':'';

  (function fillYears(){
    var sel=document.getElementById('fy');
    var now=new Date(), y=now.getMonth()>=3?now.getFullYear():now.getFullYear()-1;
    sel.innerHTML='<option value="">every year</option>';
    for(var i=0;i<12;i++){var f=(y-i)+'-'+String((y-i+1)%100).padStart(2,'0');
      sel.innerHTML+='<option value="'+f+'">'+f+'</option>';}
  })();

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function money(n){
    if(n===0||n==null)return '—';
    var a=Math.abs(n),s=n<0?'-':'';
    if(a>=1e7)return s+(a/1e7).toFixed(2)+' Cr';
    if(a>=1e5)return s+(a/1e5).toFixed(2)+' L';
    if(a>=1e3)return s+(a/1e3).toFixed(1)+' K';
    return s+Math.round(a);
  }
  // Bills get reconciled against Tally to the rupee, so they are shown to the rupee
  // rather than in the lakhs-and-crores the rest of the page uses.
  function rupees(n){
    if(n==null)return '\u2014';
    var neg=n<0,a=Math.round(Math.abs(n));
    return (neg?'-':'')+'\u20b9'+a.toLocaleString('en-IN');
  }
  function fmtDate(d){if(!d||d.length<8)return d||'';
    var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.slice(6,8)+'-'+M[parseInt(d.slice(4,6),10)-1]+'-'+d.slice(0,4);}

  // ---- 1. the ledgers this name could mean ---------------------------------
  function ledgersTable(d){
    if(!d.ledgers.length) return '<div class="body muted">No ledger in Tally has that in its name. Check the spelling, or try a shorter fragment.</div>';
    var rows=d.ledgers.map(function(l){
      var tags='';
      if(l.mergedAway) tags+='<span class="tag warn">merged into '+esc(l.canonical)+'</span>';
      if(l.interBranch) tags+='<span class="tag warn">inter-branch</span>';
      tags+='<span class="tag '+(l.role==='debtor'?'good':(l.role==='creditor'?'good':'bad'))+'">'+esc(l.role)+'</span>';
      return '<tr><td class="mono">'+esc(l.name)+tags+'</td>'
        +'<td class="mono muted">'+esc(l.chain.join(' › '))+'</td></tr>';
    }).join('');
    var note=d.ledgers.length>1
      ? '<div class="note"><b>'+d.ledgers.length+' separate ledgers</b> carry this name. Each page shows whichever of them has activity, so the same customer can look like different rows in different places. To make them one, use <b>🔗 Merge names</b> on the portal.'
      : '';
    return '<div class="scroll"><table><thead><tr><th>Ledger in Tally</th><th>Group it sits under</th></tr></thead>'
      +'<tbody>'+rows+'</tbody></table></div>'+note;
  }

  // ---- 2. what the stored year-on-year fold holds ---------------------------
  function storedTable(d){
    var names=Object.keys(d.stored||{});
    if(!names.length) return '<div class="body muted">The Year on Year fold holds nothing for these names'
      +(d.fy?(' in '+esc(d.fy)):'')+'. If the date-range page does show something, the difference is below, voucher by voucher.</div>';
    var head='<tr><th>Ledger</th><th>Section &middot; measure</th><th>Year</th>'
      +MN.map(function(m){return '<th style="text-align:right">'+m+'</th>';}).join('')+'<th style="text-align:right">Total</th></tr>';
    var body='';
    names.forEach(function(n){
      var byKey=d.stored[n];
      Object.keys(byKey).forEach(function(k){
        Object.keys(byKey[k]).sort().forEach(function(fy){
          var a=byKey[k][fy],t=a.reduce(function(x,y){return x+y;},0);
          body+='<tr><td class="mono">'+esc(n)+'</td><td class="mono muted">'+esc(k)+'</td><td class="mono">'+esc(fy)+'</td>'
            +a.map(function(v){return '<td class="num">'+money(v)+'</td>';}).join('')
            +'<td class="num"><b>'+money(t)+'</b></td></tr>';
        });
      });
    });
    return '<div class="scroll"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
  }

  // ---- 3. the vouchers, and what the fold made of each ----------------------
  function voucherRows(d){
    if(!d.vouchers.length) return '<div class="body muted">No voucher in this period touches any of those ledgers.</div>';
    var body=d.vouchers.map(function(v){
      var s=v.sale, p=v.purchase, verdict, cls;
      if(s.attributedTo){ verdict='Sale → <b>'+esc(s.attributedTo)+'</b>'; cls='good'; }
      else if(p.attributedTo){ verdict='Purchase → <b>'+esc(p.attributedTo)+'</b>'; cls='good'; }
      else { verdict='counted for nobody — '+esc(s.why); cls='bad'; }
      var amounts=s.attributedTo
        ? 'Net (P&amp;L) '+money(s.netpl)+' &middot; Net+charges '+money(s.net)+' &middot; Gross '+money(s.gross)
        : (p.attributedTo ? 'Net (P&amp;L) '+money(p.netpl)+' &middot; Net+charges '+money(p.net)+' &middot; Gross '+money(p.gross) : '');
      var legs=(v.revenueLegs||[]).concat(v.purchaseLegs||[]).map(function(l){
        return esc(l.ledger)+' '+money(l.amount)+(l.salesAccount===false||l.purchaseAccount===false?' <span class="tag warn">not a Sales/Purchase A/c</span>':'');
      }).join('<br>')||'<span class="muted">no revenue or purchase leg</span>';
      var parties=(v.debtors||[]).concat(v.creditors||[]).map(function(x){
        return esc(x.party)+' '+money(x.amount);
      }).join('<br>')||'<span class="muted">no Sundry Debtor or Creditor</span>';
      var dropped=(v.interBranchDropped||[]).length
        ? '<div class="muted" style="font-size:11px;margin-top:4px">dropped as inter-branch: '+esc(v.interBranchDropped.join(', '))+'</div>' : '';
      return '<tr>'
        +'<td class="mono">'+fmtDate(v.date)+'<div class="muted" style="font-size:11px">'+esc(v.type||'')+' '+esc(v.no||'')+' &middot; '+esc((v.branch||'').toUpperCase())+'</div></td>'
        +'<td>'+legs+'</td>'
        +'<td>'+parties+dropped+'</td>'
        +'<td><span class="tag '+cls+'">'+verdict+'</span>'
        +(amounts?'<div class="muted" style="font-size:11px;margin-top:4px">'+amounts+'</div>':'')+'</td>'
        +'</tr>';
    }).join('');
    return '<div class="scroll"><table><thead><tr><th>Voucher</th><th>Sale / purchase legs</th>'
      +'<th>Parties on it</th><th>What the fold did with it</th></tr></thead><tbody>'+body+'</tbody></table></div>'
      +(d.truncated?'<div class="note">Only the first 200 vouchers are shown. Pick one financial year to narrow it.</div>':'')
      +'<div class="note">The whole invoice goes to the <b>largest</b> Sundry Debtor on the voucher (or the largest Sundry Creditor, for a purchase). A voucher with no revenue leg, or with no debtor on it, is counted for nobody in the sales sections &mdash; both pages agree on that.</div>';
  }

  // ---- 4. the bills behind the outstanding figure ---------------------------
  // Outstanding = the uploaded CSV + the invoices inside the loaded date range.
  // A bill in neither is simply not there, and this says which of the two is short.
  function billsSection(d){
    var b=d.bills; if(!b) return '<div class="body muted">No bill information.</div>';
    var CSVNAME={kolBillsRecv:'Kol Bills Receivable',kolBillsPay:'Kol Bills Payable',ahmBillsPay:'Ahm Bills Payable'};
    var csv=Object.keys(b.csv).map(function(k){
      var c=b.csv[k];
      var when=c.uploaded?new Date(c.uploaded).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):null;
      var newest=c.newestBill?fmtDate(c.newestBill):'—';
      var tag=c.uploaded?('<span class="tag">uploaded '+esc(when)+'</span>'):'<span class="tag bad">never uploaded</span>';
      var mine=c.mine.length
        ? '<table style="margin-top:6px"><thead><tr><th>Bill</th><th>Raised</th><th>Due</th>'
          +'<th style="text-align:right">Outstanding in the file</th></tr></thead><tbody>'
          +c.mine.map(function(x){return '<tr><td class="mono">'+esc(x.ref||'(no ref)')+(x.isAdvance?'<span class="tag">advance</span>':'')
            +'</td><td class="mono">'+fmtDate(x.date)+'</td><td class="mono muted">'+esc(String(x.overdueDays||0))+' days overdue</td>'
            +'<td class="num">'+rupees(x.amount)+'</td></tr>';}).join('')+'</tbody></table>'
        : '<div class="muted" style="font-size:12px;margin-top:4px">this party has no bill in this file</div>';
      return '<div style="margin-bottom:12px"><b>'+esc(CSVNAME[k]||k)+'</b>'+tag
        +'<span class="tag">'+c.rows+' bills in file</span>'
        +'<span class="tag'+(c.newestBill?' warn':' warn')+'">covers up to '+esc(newest)+'</span>'
        +mine+'</div>';
    }).join('');

    var refs=Object.keys(b.refs||{});
    var vch='<div class="body" style="padding-top:0"><b>What the vouchers themselves say</b>'
      +'<div class="muted" style="font-size:12px">every year, whatever date range the pages are showing</div></div>'
      +(refs.length
      ? '<div class="scroll"><table><thead><tr><th>Bill reference</th><th>First seen</th><th>Last touched</th>'
        +'<th style="text-align:right">Raised</th><th style="text-align:right">Settled</th>'
        +'<th style="text-align:right">Still open</th></tr></thead><tbody>'
        +refs.map(function(k){var r=b.refs[k];
          return '<tr><td class="mono">'+esc(r.ref)+'</td><td class="mono">'+fmtDate(r.first)+'</td>'
            +'<td class="mono muted">'+fmtDate(r.last)+'</td><td class="num">'+rupees(r.raised)+'</td>'
            +'<td class="num">'+rupees(r.settled)+'</td><td class="num"><b>'+rupees(r.net)+'</b></td></tr>';}).join('')
        +'</tbody></table></div>'
      : '<div class="body muted">No voucher of this party carries a bill reference. Bill-wise capture was added to the pipeline in <b>August 2026</b> — anything pulled before that has no allocations, and a receipt is matched oldest-bill-first instead.</div>');

    var gaps='';
    if((b.onlyInCsv||[]).length) gaps+='<div class="note"><b>In the uploaded file but on no voucher we hold:</b> <span class="mono">'
      +esc(b.onlyInCsv.slice(0,20).join(', '))+'</span>. These come from a year the loaded date range does not cover — widen the range, or they exist only in the file.</div>';
    if((b.onlyInVouchers||[]).length) gaps+='<div class="note"><b>On a voucher but not in the uploaded file:</b> <span class="mono">'
      +esc(b.onlyInVouchers.slice(0,20).join(', '))+'</span>. If one of these is still unpaid in Tally, the file is older than the bill — export Bills Receivable again and upload it.</div>';

    return '<div class="body">'+csv+'</div>'+vch+gaps
      +'<div class="note">A party\'s outstanding on the Projected page is <b>the uploaded CSV plus the invoices inside the loaded date range</b>, less its receipts. <b>Mind the gap:</b> what the file <i>covers up to</i> matters more than when it was uploaded — if the loaded range starts LATER than that, every unpaid bill raised in between is in neither source, and simply does not appear. Either export Bills Receivable again as of today, or widen the range back to where the file ends.</div>';
  }

  function render(d){
    out.innerHTML=
      '<section><h2>1 &middot; WHICH LEDGERS THIS NAME COULD MEAN</h2>'+ledgersTable(d)+'</section>'
      +'<section><h2>2 &middot; WHAT YEAR ON YEAR HAS STORED</h2>'+storedTable(d)+'</section>'
      +'<section><h2>3 &middot; EVERY VOUCHER, AND WHY IT COUNTED OR DID NOT</h2>'+voucherRows(d)+'</section>'
      +'<section><h2>4 &middot; THE BILLS BEHIND THE OUTSTANDING FIGURE</h2>'+billsSection(d)+'</section>'
      +'<section><h2>THE RAW ANSWER</h2><div class="body">'
      +'<div class="copybar"><button type="button" id="copyjson">\ud83d\udccb Copy JSON</button>'
      +'<span class="muted">everything on this page, as one block \u2014 paste it when asking someone to look</span>'
      +'<span class="copied" id="copied" hidden>Copied</span></div>'
      +'<details><summary>Show it here</summary>'
      +'<pre id="rawjson">'+esc(JSON.stringify(d,null,1))+'</pre></details></div></section>';
    // Clipboard first; a plain text selection is the fallback where it is blocked
    // (an office browser on http, or an old one).
    var btn=document.getElementById('copyjson');
    if(btn)btn.addEventListener('click',function(){
      var txt=JSON.stringify(d,null,1);
      function done(){var c=document.getElementById('copied');if(!c)return;
        c.hidden=false;setTimeout(function(){c.hidden=true;},2000);}
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done,fallback);
      } else fallback();
      function fallback(){
        var ta=document.createElement('textarea');ta.value=txt;
        ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);
        ta.select();
        try{document.execCommand('copy');done();}catch(e){alert('Could not copy automatically. Open "Show it here" and copy by hand.');}
        document.body.removeChild(ta);
      }
    });
  }

  document.getElementById('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var q=document.getElementById('q').value.trim();
    if(q.length<2){out.innerHTML='<section><div class="body err">Type at least two characters of the name.</div></section>';return;}
    var btn=document.getElementById('go');btn.disabled=true;btn.textContent='Looking…';
    out.innerHTML='<section><div class="body muted">Reading the ledgers, the stored fold and the vouchers…</div></section>';
    var url=BASE+'/api/yoy/diag?q='+encodeURIComponent(q)
      +'&branch='+encodeURIComponent(document.getElementById('branch').value)
      +'&fy='+encodeURIComponent(document.getElementById('fy').value);
    fetch(url).then(function(r){return r.json();}).then(function(d){
      if(!d||d.ok===false)throw new Error((d&&d.error)||'the server said no');
      render(d);
    }).catch(function(e){
      out.innerHTML='<section><div class="body err">Could not read it: '+esc(e.message||e)+'</div></section>';
    }).then(function(){btn.disabled=false;btn.textContent='Explain';});
  });
})();
</script>
</body>
</html>
