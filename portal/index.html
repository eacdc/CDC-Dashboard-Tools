// Receipt-allocation mode, shared by every namespace below. Set from the portal's
// Bill-wise / FIFO toggle; read by the projection engine and stamped onto anything
// exported, so a downloaded file always says which engine produced it.

// Switching a view, or reloading the data behind one, re-renders thousands of rows
// synchronously -- on a full year of data the click looks dead for a second or two.
// React cannot paint in the middle of a render, so setting the new state straight
// from the handler shows nothing until the new view is ready. Instead: set a busy
// tag, let the browser paint it (rAF runs before the next paint, the timeout inside
// it after), and only then do the work. The work and clearing the tag are batched
// into ONE render -- unbatched, each would trigger the expensive render separately.
function runBusyWith(setBusy,tag,fn){
  setBusy(tag);

    var run=function(){try{fn();}finally{setBusy('');}};
    try{if(ReactDOM.unstable_batchedUpdates){ReactDOM.unstable_batchedUpdates(run);return;}}catch(_e){}
    run();

// Canonicalize ledger/party names so a party renamed in Tally is merged everywhere.
// Identity = the ledger's stable GUID (xd.ids: name->guid). A manual alias map
// (window.__cdcAliases: variant->canonical) bridges an OLD name (gone from the
// current master, so it has no guid) to its current name. Mutates vouchers/bills
// in place; returns the canonicalizer for reuse.

  function rk(obj){if(!obj)return obj;var o={};for(var k in obj){var ck=cn(k);o[ck]=(o[ck]||0)+obj[k];}return o;}

function findIBLedgers(xd){

}

function parseStock(text){var lines=text.split('\n');var stock=Array(12).fill(0);for(var i=1;i<lines.length;i++){if(!lines[i].trim())continue;var c=lines[i].split(',');try{var idx=parseInt(c[0]);var am=parseFloat((c[1]||'0').replace(/,/g,''));if(!isNaN(idx)&&idx>=0&&idx<12)stock[idx]=am;}catch(ex){}}return stock;}

function norm(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'');}

}
function classify(name,xd,lu,overrides){if(overrides&&overrides[name])return overrides[name];var chain=getChain(name,xd,lu);for(var i=0;i<chain.length;i++){if(PL_CATS[chain[i]])return PL_CATS[chain[i]];}return 'excluded';}
// Ledger category overrides (audit tool). Stored as {ledgerName: 'revenue'|'purchase'|'direct_expense'|'indirect_expense'|'excluded'}.
function loadLedgerOverrides(){try{if(!window.localStorage)return{};var raw=localStorage.getItem('cdc_ledger_overrides');return raw?JSON.parse(raw)||{}:{};}catch(e){return{};}}
function saveLedgerOverrides(o){try{if(window.localStorage)localStorage.setItem('cdc_ledger_overrides',JSON.stringify(o||{}));}catch(e){}}
// Invoice (voucher) → account overrides. Each Sales / Purchase voucher gets a stable key, and
// the user can re-route that single invoice's sale/purchase leg to a different account.
// Stored as {voucherKey: 'Sale - Packaging - Mono Carton'}.
function loadInvoiceOverrides(){try{if(!window.localStorage)return{};var raw=localStorage.getItem('cdc_invoice_acct_overrides');return raw?JSON.parse(raw)||{}:{};}catch(e){return{};}}

// Build a stable key for a voucher. Tries Tally voucher-number fields first; falls back to a
// composite of date + sorted ledger lines (stable across re-uploads of the same data).
function vchKey(v){
  if(v.voucher_no)return 'V:'+v.voucher_no;
  if(v.vchno)return 'V:'+v.vchno;
  if(v.vch_no)return 'V:'+v.vch_no;
  if(v.voucherNo)return 'V:'+v.voucherNo;
  if(v.number)return 'V:'+v.number;
  if(v.refNo)return 'V:'+v.refNo;
  if(v.ref)return 'V:'+v.ref;

// Human-facing invoice / voucher number (as printed on the Tally voucher). Empty when the
// source data carries no explicit number (composite-keyed vouchers).
function vchNo(v){var n=v.no||v.voucher_no||v.vchno||v.vch_no||v.voucherNo||v.number||v.refNo||v.ref;return n==null?'':String(n);}

function processData(vouchers,xd,stock,ibLedgers,monthCount,fyOffset,branch){

//     is applied to THAT exact bill, honouring how it was posted in Tally.
//   PASS 2 (date FIFO) — anything left over (receipts with no bill reference, "On

//     first, exactly like the original engine. Leftover money accrues as an advance

function buildPVA(data,vouchers,xd,ib,recBills,payBills2,dOvr,excl,exBills){

  var predData=buildProjection(vouchers,xd,ib,recBills,payBills2||[],lmStart);
  // Apply overrides via recalc (same as main dashboard)
  var predRecalc=recalc(predData,dOvr,excl,exBills);
  // Month 0 of that projection = predicted amounts for last month
  var predicted={};
  for(var p in predRecalc.projInflowStats){
    var mo=predRecalc.projInflows[p];
    if(mo&&mo[0]>5000&&!excl[p])predicted[p]={amt:mo[0],days:predRecalc.projInflowStats[p].days};
  }

      var hBr=false;for(var pp in pls)if(ib[pp]){hBr=true;break;}

// Stable identity for one unpaid bill, so a single invoice can be dropped from the
// projection without excluding the whole party. Amount is rounded so tiny float
// drift between rebuilds can't orphan an exclusion.

// collectable/payable is removed from the CLOSING BALANCE of every month from the
// one it was raised in onward, so the outstanding trend (and the DSO/DPO derived
// from it) reflects only money that could really have come in. Sales are left
// untouched: the invoice was genuinely raised — writing it off kills the
// receivable, not the sale.
// The tree is a strict aggregation, so leaves are adjusted and every ancestor is
// recomputed from its children. Returns a new tree; the original is not mutated.

//      expected in different months; parties with no history of their own fall back
//      to the group / company average, which is itself computed per dataset.

// Editor for the shared party name-merge map: "variant/old name" -> "canonical/current name".
// Collapse chains so every variant points STRAIGHT at its final name. __cdcCanon
// looks a name up once -- it does not follow A->B->C -- so a chain would leave A
// resolving to B, which is no longer a real party. Accepting several suggestions at
// once makes chains likely (the scan can offer both "old -> middle" and
// "middle -> current"), so flatten on every save. A cycle keeps its first target
// rather than looping forever.
function flattenAliases(map){
  var out={};
  for(var k in map){
    var seen={},v=map[k];seen[k]=1;
    while(map[v]&&!seen[v]){seen[v]=1;v=map[v];}
    // A cycle (A->B->A) is contradictory input, and following it lands back on the
    // name we started from -- which would drop the entry entirely and leave the user
    // wondering where their merge went. Keep the hop they actually asked for.
    if(v===k)v=map[k];
    if(v!==k)out[k]=v;   // a name mapping to itself is not an alias
  }
  return out;
}
